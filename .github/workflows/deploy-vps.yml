name: Deploy to VPS

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "prototype/**"
  workflow_dispatch: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pull the new commit on the server and run the idempotent deploy script.
      # Secrets: VPS_HOST (76.13.145.229), VPS_USER, SSH_PRIVATE_KEY, VPS_PATH (/var/www/datainfo)
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ secrets.VPS_PATH }}
            git fetch --all
            git reset --hard origin/main
            ./deploy.sh
