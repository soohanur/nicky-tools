[project]
name = "scraply-backend"
version = "2.0.0"
description = "Scraply - company.info contact extraction backend (FastAPI + Celery)"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "python-multipart==0.0.6",
    # Database
    "sqlalchemy==2.0.25",
    "alembic==1.13.1",
    "psycopg2-binary==2.9.9",
    "asyncpg==0.29.0",
    # Queue
    "redis==5.0.1",
    "celery==5.3.6",
    "flower==2.0.1",
    # Auth + settings
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.1.2",
    "python-dotenv==1.0.0",
    "pydantic==2.5.3",
    "pydantic-settings==2.1.0",
    "email-validator==2.1.0",
    "psutil==5.9.8",
    # Realtime + files
    "websockets==12.0",
    "aiofiles==23.2.1",
    "python-magic==0.4.27",
    # Monitoring
    "prometheus-client==0.19.0",
    "sentry-sdk==1.40.0",
    # Scraper engine (<repo>/scraply) dependencies
    "openpyxl==3.1.2",
    "selenium==4.16.0",
    "webdriver-manager==4.0.1",
    "pandas==2.1.4",
    "colorama==0.4.6",
    # Utilities
    "emails==0.6",
    "httpx==0.26.0",
    "pydantic-extra-types==2.4.1",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "anyio>=4.7",
    "aiosqlite>=0.20",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions", "app/domains/scraply"]  # scraper engine is frozen

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "UP042"]  # B008: FastAPI Depends() in defaults; UP042: (str, Enum) kept for py<3.11 + SQLEnum

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
