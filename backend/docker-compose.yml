services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: automation_postgres
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-automation_db}
      POSTGRES_USER: ${POSTGRES_USER:-automation_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-automation_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-automation_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis (Cache & Message Broker)
  redis:
    image: redis:7-alpine
    container_name: automation_redis
    env_file:
      - ../.env
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: automation_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ../automation_data:/app/automation_data
      - ../scraply:/app/scraply
      - ../chrome_profiles:/app/chrome_profiles
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-automation_user}:${POSTGRES_PASSWORD:-automation_password}@postgres/${POSTGRES_DB:-automation_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - PYTHONPATH=/app:/app/scraply
      - COMPANYINFO_EMAIL=${COMPANYINFO_EMAIL}
      - COMPANYINFO_PASSWORD=${COMPANYINFO_PASSWORD}
      - COMPANYINFO_URL=${COMPANYINFO_URL:-https://company.info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Celery Worker - Background job processor
  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: automation_celery
    command: celery -A app.core.celery_app worker --loglevel=info --pool=solo --concurrency=1
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ../scraply:/app/scraply
      - ../chrome_profiles:/app/chrome_profiles
      - ../logs:/app/logs
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - PYTHONPATH=/app:/app/scraply
      - COMPANYINFO_EMAIL=${COMPANYINFO_EMAIL}
      - COMPANYINFO_PASSWORD=${COMPANYINFO_PASSWORD}
      - COMPANYINFO_URL=${COMPANYINFO_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Flower (Celery Monitoring)
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: automation_flower
    command: celery -A app.core.celery_app flower --port=5555 --broker=redis://redis:6379/0
    env_file:
      - ../.env
    ports:
      - "5555:5555"
    volumes:
      - ./app:/app/app
      - ../scraply:/app/scraply
      - ../chrome_profiles:/app/chrome_profiles
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - PYTHONPATH=/app:/app/scraply
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: automation_network
